name: mobile-messenger-development

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - .:/app
      - /app/node_modules
      - backend_logs:/app/logs
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:$${PORT:-8080}/api/health"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - messenger_app
      - messenger_database

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in server/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in server/.env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in server/.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,uid=999,gid=999,mode=0770
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - messenger_database

  pgadmin:
    image: dpage/pgadmin4:9
    profiles:
      - database-tools
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in server/.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in server/.env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/misc/ping
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - messenger_database

volumes:
  backend_logs:
  postgres_data:
  pgadmin_data:

networks:
  messenger_app:
    driver: bridge
  messenger_database:
    driver: bridge
    internal: true
