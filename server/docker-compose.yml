name: mobile-messenger-production

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ${PRODUCTION_ENV_FILE:-.env.production}
        required: true
    environment:
      NODE_ENV: production
      DB_SYNCHRONIZE: "false"
      E2EE_ENABLED: "true"
      E2EE_REQUIRED: "true"
    command:
      - sh
      - -ec
      - npm run migration:run:dist && exec npm run start
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/logs:size=64m,uid=1000,gid=1000,mode=0750
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null "http://127.0.0.1:$${PORT:-3001}/api/health"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - messenger_edge

networks:
  messenger_edge:
    driver: bridge
