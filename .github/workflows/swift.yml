name: Mobile Messenger CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    env:
      SCHEME: MobileMessengerIOS
      PROJECT: MobileMessengerIOS.xcodeproj

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select iOS simulator
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          PREFERRED_IPHONES = [
              "iPhone 17 Pro",
              "iPhone 17",
              "iPhone 16 Pro",
              "iPhone 16",
              "iPhone 16e",
              "iPhone 15 Pro",
              "iPhone 15",
          ]

          def load_json(*args: str) -> dict:
              return json.loads(subprocess.check_output(args, text=True))

          def version_key(identifier: str) -> tuple[int, ...]:
              return tuple(int(part) for part in re.findall(r"\d+", identifier))

          devices_by_runtime = load_json(
              "xcrun", "simctl", "list", "devices", "available", "-j"
          )["devices"]
          candidates: list[dict[str, str]] = []

          for runtime_id, devices in devices_by_runtime.items():
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append(
                          {
                              "name": device["name"],
                              "runtime_id": runtime_id,
                              "udid": device["udid"],
                          }
                      )

          candidates.sort(
              key=lambda device: (
                  version_key(device["runtime_id"]),
                  device["name"],
              ),
              reverse=True,
          )

          selected = None
          for preferred_name in PREFERRED_IPHONES:
              selected = next(
                  (
                      device
                      for device in candidates
                      if device["name"] == preferred_name
                  ),
                  None,
              )
              if selected is not None:
                  break

          if selected is None and candidates:
              selected = candidates[0]

          if selected is None:
              inventory = load_json(
                  "xcrun", "simctl", "list", "-j", "devicetypes", "runtimes"
              )
              runtimes = [
                  runtime
                  for runtime in inventory["runtimes"]
                  if runtime.get("isAvailable") and runtime.get("platform") == "iOS"
              ]
              if not runtimes:
                  print("No available iOS simulator runtimes found.", file=sys.stderr)
                  sys.exit(1)

              runtimes.sort(
                  key=lambda runtime: version_key(runtime["identifier"]),
                  reverse=True,
              )
              device_types = {
                  device_type["name"]: device_type["identifier"]
                  for device_type in inventory["devicetypes"]
                  if device_type.get("productFamily") == "iPhone"
              }

              selected_name = next(
                  (
                      name
                      for name in PREFERRED_IPHONES
                      if name in device_types
                  ),
                  None,
              )
              if selected_name is None:
                  selected_name = sorted(device_types)[0]

              selected_runtime = runtimes[0]
              selected_udid = subprocess.check_output(
                  [
                      "xcrun",
                      "simctl",
                      "create",
                      f"CI {selected_name}",
                      device_types[selected_name],
                      selected_runtime["identifier"],
                  ],
                  text=True,
              ).strip()
              selected = {
                  "name": selected_name,
                  "runtime_id": selected_runtime["identifier"],
                  "udid": selected_udid,
              }

          print(
              f"Selected simulator: {selected['name']} "
              f"({selected['runtime_id']}) [{selected['udid']}]"
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"IOS_SIMULATOR_ID={selected['udid']}\n")
          PY

      - name: Run iOS tests
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$IOS_SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build release configuration
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "id=$IOS_SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO \
            build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify formatting
        run: npm run format:check

      - name: Verify OpenAPI contract
        run: npm run contract:check

      - name: Lint backend
        run: npm run lint

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Verify production security invariants
        working-directory: .
        run: Scripts/verify-production-security.sh

      - name: Validate fail-closed production environment
        run: |
          export NODE_ENV=production
          export DB_SYNCHRONIZE=false
          export JWT_ACCESS_CURRENT_KEY_ID=ci-current
          export JWT_ACCESS_CURRENT_SECRET="$(openssl rand -hex 32)"
          export JWT_ACCESS_PREVIOUS_KEY_ID=ci-previous
          export JWT_ACCESS_PREVIOUS_SECRET="$(openssl rand -hex 32)"
          export JWT_ISSUER=mobile-messenger-ci
          export JWT_AUDIENCE=mobile-messenger-ci-clients
          export JWT_ACCESS_EXPIRES_IN=10m
          export JWT_REFRESH_EXPIRES_IN=30d
          export OTP_PEPPER="$(openssl rand -hex 32)"
          export REFRESH_TOKEN_PEPPER="$(openssl rand -hex 32)"
          export LOG_IP_HASH_KEY="$(openssl rand -hex 32)"
          export CORS_ORIGINS=https://messenger.example.invalid
          export WS_ORIGINS=https://messenger.example.invalid
          export S3_ENDPOINT=https://s3.example.invalid
          export S3_ACCESS_KEY=ci-validation-access-key
          export S3_SECRET_KEY="$(openssl rand -hex 32)"
          export S3_BUCKET=messenger-ci-validation
          export S3_REGION=eu-west-1
          export S3_TLS_ENABLED=true
          export E2EE_ENABLED=true
          export E2EE_REQUIRED=true
          export AUTH_ENABLE_DEMO_ACCOUNTS=false
          export AUTH_ALLOW_TEST_CODE=false
          export COOKIE_SECURE=true
          node -e 'require("./dist/modules/common/runtime-config.js").validateRuntimeConfig()'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Audit production dependencies
        run: npm run audit:security

      - name: Verify formatting
        run: npm run format:check

      - name: Verify OpenAPI contract
        run: npm run contract:check

      - name: Lint web client
        run: npm run lint

      - name: Typecheck web client
        run: npm exec -- tsc -b --pretty false

      - name: Run web tests
        run: npm test

      - name: Build web client
        run: npm exec -- vite build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Install locked backend dependencies
        working-directory: server
        run: npm ci

      - name: Run clean and legacy migration smoke tests
        run: Scripts/migration-smoke.sh

  dependency-review:
    if: >-
      github.event_name == 'pull_request' &&
      vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0,AGPL-3.0

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  container:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        run: docker build --file Dockerfile --tag mobile-messenger-backend:ci .

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mobile-messenger-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
